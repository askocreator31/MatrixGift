*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,"Segoe UI",sans-serif;
    background:radial-gradient(
        circle at 50% 35%,
        #ffe7f0 0%,
        #ffc0d7 42%,
        #f28eb3 100%
    );
    color:#641b3b;
}

.hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.heart{
    position:absolute;
    top:-30px;
    color:rgba(255,255,255,.72);
    animation:fall linear infinite;
    filter:drop-shadow(0 2px 4px rgba(120,20,60,.12));
}

@keyframes fall{
    0%{
        transform:translateY(-40px) rotate(0);
        opacity:0;
    }
    12%{opacity:1}
    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

.wrap{
    position:relative;
    z-index:5;
    width:min(92%,560px);
    text-align:center;
}

.envelope-area{
    transition:1s ease;
}

.envelope{
    width:280px;
    height:185px;
    position:relative;
    margin:0 auto 25px;
    cursor:pointer;
    filter:drop-shadow(0 18px 25px rgba(130,30,70,.25));
}

.env-body{
    position:absolute;
    inset:0;
    border-radius:12px;
    overflow:hidden;
    background:linear-gradient(145deg,#fff8fb,#ffd0e1);
}

    position:absolute;
    bottom:0;
    left:0;
    border-style:solid;

}

    content:"";
    position:absolute;
    bottom:0;
    right:0;
    border-style:solid;

    border-color:#ee98b9 transparent transparent;
}
